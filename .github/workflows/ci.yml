name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Test MTPKit
        working-directory: Packages/MTPKit
        run: swift test

      - name: Build app
        run: |
          xcodebuild -project slopMTP.xcodeproj -scheme slopMTP -configuration Release \
            -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO build
