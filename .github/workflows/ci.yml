name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Test MTPKit
        working-directory: Packages/MTPKit
        run: swift test

      - name: Build app
        run: |
          xcodebuild -project SlopMTP.xcodeproj -scheme SlopMTP -configuration Release \
            -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO build
