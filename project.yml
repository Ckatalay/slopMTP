name: slopMTP
options:
  bundleIdPrefix: io.github.ckatalay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MTPKit:
    path: Packages/MTPKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Localization: the compiler extracts localizable strings into String Catalogs.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  slopMTP:
    type: application
    platform: macOS
    sources:
      - App/slopMTP
    dependencies:
      - package: MTPKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ckatalay.SlopMTP
        PRODUCT_NAME: slopMTP
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: slopMTP
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        # Not sandboxed: talks to USB devices directly through IOUSBHost.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        # Release builds are signed for distribution outside the App Store and notarized
        # by scripts/release.sh. Debug builds stay ad-hoc signed.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: G2743AT3J4
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Notarization rejects the debugger entitlement Xcode adds by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  slopMTP:
    build:
      targets:
        slopMTP: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MTPKit/MTPKitTests
